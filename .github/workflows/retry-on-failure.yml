name: Retry SEO Monitor on transient failure

# Cloudflare's bot protection intermittently 403s Lighthouse's headless Chrome
# when it happens to land on a poorly-reputed GitHub Actions runner IP. A
# re-run gets a fresh runner (new egress IP) and usually clears it. This
# retries a failed "SEO & Performance Monitor" run exactly once — if the
# retry also fails, it's a real problem and is left to notify normally.
on:
  workflow_run:
    workflows: ["SEO & Performance Monitor"]
    types: [completed]

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs on a fresh runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs" \
            --method POST
