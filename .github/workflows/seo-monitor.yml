name: SEO & Performance Monitor

on:
  workflow_run:
    workflows: ["Deploy to Hostinger (FTP)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  notify-indexnow:
    name: Submit deployed canonical pages
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate deployed key and submit sitemap URLs
        env:
          SITE_HOST: kcedynamics.com
          INDEXNOW_KEY: 83b9cd75f5e79586b3ccce3583dc94aa
        run: python3 .github/scripts/submit-indexnow.py

  lighthouse:
    name: Lighthouse performance audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Audit — Home
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/
          uploadArtifacts: true
          artifactName: lighthouse-results-home
          runs: 1

      - name: Audit — About
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/about.html
          uploadArtifacts: true
          artifactName: lighthouse-results-about
          runs: 1

      - name: Audit — Services
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/services.html
          uploadArtifacts: true
          artifactName: lighthouse-results-services
          runs: 1

      - name: Audit — Projects
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/projects.html
          uploadArtifacts: true
          artifactName: lighthouse-results-projects
          runs: 1

      - name: Audit — Contact
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/contact.html
          uploadArtifacts: true
          artifactName: lighthouse-results-contact
          runs: 1

      - name: Audit — Careers
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://kcedynamics.com/careers.html
          uploadArtifacts: true
          artifactName: lighthouse-results-careers
          runs: 1
